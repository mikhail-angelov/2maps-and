name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6

      - name: Set APK version
        shell: bash
        run: |
          echo "MAPS_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "MAPS_VERSION_NAME=${tag#v}" >> "$GITHUB_ENV"
            elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
              echo "Expected a tag such as v1.2.3" >&2
              exit 1
            else
              echo "MAPS_VERSION_NAME=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            fi
          else
            echo "MAPS_VERSION_NAME=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Test, lint, and build release APK
        run: ./gradlew --no-daemon build

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: |
            mkdir -p "$RUNNER_TEMP/road-data"
            curl --fail --location --retry 2 https://brouter.de/brouter/segments4/E40_N55.rd5 --output "$RUNNER_TEMP/road-data/E40_N55.rd5"
            curl --fail --location --retry 2 https://brouter.de/brouter/segments4/E45_N55.rd5 --output "$RUNNER_TEMP/road-data/E45_N55.rd5"
            adb shell mkdir -p /data/local/tmp/2maps-routing-test
            adb push "$RUNNER_TEMP/road-data/E40_N55.rd5" "$RUNNER_TEMP/road-data/E45_N55.rd5" /data/local/tmp/2maps-routing-test/
            adb shell chmod 644 /data/local/tmp/2maps-routing-test/E40_N55.rd5 /data/local/tmp/2maps-routing-test/E45_N55.rd5
            ./gradlew --no-daemon :app:connectedDebugAndroidTest || { adb logcat -d > "$RUNNER_TEMP/android-logcat.txt"; adb logcat -d -s AndroidRuntime:E libc:F DEBUG:F; exit 1; }

      - name: Save Android test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-diagnostics
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/android-logcat.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Save unsigned release APK
        env:
          VERSION_NAME: ${{ env.MAPS_VERSION_NAME }}
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk "app/build/outputs/apk/release/2Maps-v${VERSION_NAME}-unsigned.apk"

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-release-apk
          path: app/build/outputs/apk/release/2Maps-v*-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: unsigned-release-apk
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;36.0.0'

      - name: Sign and verify APK
        shell: bash
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for name in ANDROID_SIGNING_KEY_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/2maps-release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 -f 4 "2Maps-${TAG}-unsigned.apk" "$RUNNER_TEMP/2maps-aligned.apk"
          "$tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_SIGNING_KEY_ALIAS" \
            --ks-pass env:ANDROID_SIGNING_STORE_PASSWORD \
            --key-pass env:ANDROID_SIGNING_KEY_PASSWORD \
            --out "2Maps-${TAG}.apk" "$RUNNER_TEMP/2maps-aligned.apk"
          "$tools/apksigner" verify --verbose "2Maps-${TAG}.apk"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "2Maps-${TAG}.apk" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "2Maps-${TAG}.apk" --verify-tag --generate-notes -R "$GITHUB_REPOSITORY"
          fi
