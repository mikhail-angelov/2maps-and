plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'androidx.navigation.safeargs.kotlin'
}

android {
    namespace 'com.bconf.a2maps_and'
    compileSdk 36

    defaultConfig {
        applicationId "com.bconf.a2maps_and"
        minSdk 29
        targetSdk 34
        versionCode = (System.getenv("MAPS_VERSION_CODE") ?: "1").toInteger()
        versionName = System.getenv("MAPS_VERSION_NAME") ?: "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    signingConfigs {
        if (System.getenv("SIGNING_KEY_FILE")) {
            release {
                storeFile file(System.getenv("SIGNING_KEY_FILE"))
                storePassword System.getenv("KEY_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildFeatures {
        viewBinding true
        aidl true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("SIGNING_KEY_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation files('../third_party/brouter/brouter-engine-1.7.9.jar')
    // Removed dependency versions that are managed by libs (libs.plugins)
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material // This handles com.google.android.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx

    // Map and Location
    implementation 'org.maplibre.gl:android-sdk:11.8.4'
    implementation 'com.google.android.gms:play-services-location:21.2.0'
    implementation 'com.huawei.hms:location:6.12.0.300'

    // Networking (used by auth)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'

    // Scale bar plugin
    implementation 'org.maplibre.gl:android-plugin-scalebar-v9:3.0.2'

    // QR scanner for trips; works without Google Play services (Huawei devices).
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Annotation
    implementation 'androidx.annotation:annotation:1.7.1' // Updated version

    // Testing
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation libs.junit
    testImplementation libs.androidx.test.core
    testImplementation libs.androidx.junit
    testImplementation libs.robolectric
    debugImplementation libs.androidx.fragment.testing
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
